<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Maryam Ghabel Clinical Theme Preview">
    <!-- Background gradient -->
    <defs>
        <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1B2845;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#131C30;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#C9A87C;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#A8895E;stop-opacity:1" />
        </linearGradient>
        <radialGradient id="circleGradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#C9A87C;stop-opacity:0.25" />
            <stop offset="100%" style="stop-color:#1B2845;stop-opacity:0" />
        </radialGradient>
        <filter id="softShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
            <feOffset dx="0" dy="6" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- ===== TOP BAR (Header) ===== -->
    <rect x="0" y="0" width="1200" height="80" fill="#F2EBDC"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#D4C3A8" stroke-width="1"/>

    <!-- Logo placeholder circle -->
    <circle cx="60" cy="40" r="24" fill="#1B2845"/>
    <text x="60" y="50" font-family="Vazirmatn, Tahoma, sans-serif" font-size="22" font-weight="700" fill="#C9A87C" text-anchor="middle">م</text>

    <!-- Site title in header -->
    <text x="100" y="38" font-family="Vazirmatn, Tahoma, sans-serif" font-size="20" font-weight="700" fill="#1B2845" direction="rtl">مریم قابل</text>
    <text x="100" y="58" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" fill="#A8895E" direction="rtl">روان‌شناس بالینی</text>

    <!-- Navigation links (RTL: right-aligned visually) -->
    <g font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" fill="#1B2845" text-anchor="end" direction="rtl">
        <text x="1140" y="46">خانه</text>
        <text x="1060" y="46">خدمات</text>
        <text x="980" y="46">درباره من</text>
        <text x="890" y="46">رزرو جلسه</text>
        <text x="800" y="46">تماس</text>
    </g>

    <!-- Menu icon for mobile -->
    <g stroke="#1B2845" stroke-width="2" stroke-linecap="round">
        <line x1="700" y1="38" x2="716" y2="38"/>
        <line x1="700" y1="44" x2="716" y2="44"/>
        <line x1="700" y1="50" x2="716" y2="50"/>
    </g>

    <!-- ===== HERO SECTION ===== -->
    <rect x="0" y="80" width="1200" height="360" fill="url(#navyGradient)"/>
    <circle cx="950" cy="260" r="280" fill="url(#circleGradient)"/>

    <!-- Hero circle accent -->
    <circle cx="950" cy="260" r="110" fill="url(#goldGradient)" filter="url(#softShadow)" opacity="0.85"/>
    <text x="950" y="280" font-family="Vazirmatn, Tahoma, sans-serif" font-size="64" font-weight="700" fill="#1B2845" text-anchor="middle">م.ق</text>

    <!-- Hero eyebrow badge -->
    <rect x="80" y="140" width="280" height="34" rx="17" fill="#C9A87C" fill-opacity="0.12" stroke="#C9A87C" stroke-opacity="0.4" stroke-width="1"/>
    <text x="220" y="162" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" fill="#C9A87C" text-anchor="middle" direction="rtl">مریم قابل | روان‌شناس بالینی</text>

    <!-- Hero title -->
    <text x="80" y="220" font-family="Vazirmatn, Tahoma, sans-serif" font-size="44" font-weight="700" fill="#E8DCC8" direction="rtl">روان‌شناسی عمیق برای</text>
    <text x="80" y="275" font-family="Vazirmatn, Tahoma, sans-serif" font-size="44" font-weight="700" fill="#C9A87C" direction="rtl">بزرگسالان موفق</text>

    <!-- Hero subtitle -->
    <text x="80" y="320" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" fill="#D4C3A8" direction="rtl">روانکاوی، خودآگاهی و رشد فردی برای کسانی که به دنبال درک عمیق‌تر از خود هستند.</text>

    <!-- Hero buttons -->
    <rect x="80" y="350" width="160" height="44" rx="8" fill="#C9A87C"/>
    <text x="160" y="378" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="600" fill="#1B2845" text-anchor="middle">رزرو جلسه</text>

    <rect x="252" y="350" width="160" height="44" rx="8" fill="none" stroke="#E8DCC8" stroke-width="2"/>
    <text x="332" y="378" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="600" fill="#E8DCC8" text-anchor="middle">درباره من</text>

    <!-- ===== INTRO / STATS SECTION ===== -->
    <rect x="0" y="440" width="1200" height="120" fill="#F2EBDC"/>

    <!-- Three stat cards -->
    <g font-family="Vazirmatn, Tahoma, sans-serif" text-anchor="middle" direction="rtl">
        <!-- Card 1 -->
        <rect x="80" y="460" width="320" height="80" rx="10" fill="#FFFFFF" filter="url(#softShadow)"/>
        <rect x="80" y="460" width="320" height="4" rx="2" fill="#C9A87C"/>
        <text x="240" y="500" font-size="28" font-weight="700" fill="#1B2845">۷+</text>
        <text x="240" y="520" font-size="11" fill="#2A2A2A">سال تجربه روانکاوی گروهی</text>

        <!-- Card 2 -->
        <rect x="440" y="460" width="320" height="80" rx="10" fill="#FFFFFF" filter="url(#softShadow)"/>
        <rect x="440" y="460" width="320" height="4" rx="2" fill="#C9A87C"/>
        <text x="600" y="500" font-size="28" font-weight="700" fill="#1B2845">۵۰</text>
        <text x="600" y="520" font-size="11" fill="#2A2A2A">دقیقه هر جلسه</text>

        <!-- Card 3 -->
        <rect x="800" y="460" width="320" height="80" rx="10" fill="#FFFFFF" filter="url(#softShadow)"/>
        <rect x="800" y="460" width="320" height="4" rx="2" fill="#C9A87C"/>
        <text x="960" y="500" font-size="28" font-weight="700" fill="#1B2845">۱۵</text>
        <text x="960" y="520" font-size="11" fill="#2A2A2A">دقیقه مشاوره اولیه رایگان</text>
    </g>

    <!-- ===== SERVICES SECTION ===== -->
    <rect x="0" y="560" width="1200" height="220" fill="#FFFFFF"/>

    <text x="600" y="600" font-family="Vazirmatn, Tahoma, sans-serif" font-size="24" font-weight="700" fill="#1B2845" text-anchor="middle" direction="rtl">خدمات</text>
    <text x="600" y="624" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" fill="#2A2A2A" text-anchor="middle" direction="rtl">پنج حوزه‌ی محتوایی برای رشد و شناخت خود</text>

    <!-- Five service mini cards -->
    <g font-family="Vazirmatn, Tahoma, sans-serif" text-anchor="middle" direction="rtl">
        <!-- Service 1 -->
        <rect x="60" y="650" width="200" height="100" rx="10" fill="#F2EBDC"/>
        <circle cx="160" cy="680" r="14" fill="#1B2845"/>
        <text x="160" y="685" font-size="13" font-weight="700" fill="#C9A87C">۰۱</text>
        <text x="160" y="715" font-size="12" font-weight="600" fill="#1B2845">الگوهای ناخودآگاه</text>
        <text x="160" y="732" font-size="9" fill="#2A2A2A">شناسایی الگوهای تکرارشونده</text>

        <!-- Service 2 -->
        <rect x="278" y="650" width="200" height="100" rx="10" fill="#F2EBDC"/>
        <circle cx="378" cy="680" r="14" fill="#1B2845"/>
        <text x="378" y="685" font-size="13" font-weight="700" fill="#C9A87C">۰۲</text>
        <text x="378" y="715" font-size="12" font-weight="600" fill="#1B2845">روان‌شناسی موفقیت</text>
        <text x="378" y="732" font-size="9" fill="#2A2A2A">کشف موانع درونی رشد</text>

        <!-- Service 3 -->
        <rect x="496" y="650" width="200" height="100" rx="10" fill="#F2EBDC"/>
        <circle cx="596" cy="680" r="14" fill="#1B2845"/>
        <text x="596" y="685" font-size="13" font-weight="700" fill="#C9A87C">۰۳</text>
        <text x="596" y="715" font-size="12" font-weight="600" fill="#1B2845">درس‌های بالینی</text>
        <text x="596" y="732" font-size="9" fill="#2A2A2A">بازتاب تجربه‌های بالینی</text>

        <!-- Service 4 -->
        <rect x="714" y="650" width="200" height="100" rx="10" fill="#F2EBDC"/>
        <circle cx="814" cy="680" r="14" fill="#1B2845"/>
        <text x="814" y="685" font-size="13" font-weight="700" fill="#C9A87C">۰۴</text>
        <text x="814" y="715" font-size="12" font-weight="600" fill="#1B2845">بازتاب شخصی</text>
        <text x="814" y="732" font-size="9" fill="#2A2A2A">تاملات روزانه</text>

        <!-- Service 5 -->
        <rect x="932" y="650" width="200" height="100" rx="10" fill="#F2EBDC"/>
        <circle cx="1032" cy="680" r="14" fill="#1B2845"/>
        <text x="1032" y="685" font-size="13" font-weight="700" fill="#C9A87C">۰۵</text>
        <text x="1032" y="715" font-size="12" font-weight="600" fill="#1B2845">روان‌شناسی مهاجرت</text>
        <text x="1032" y="732" font-size="9" fill="#2A2A2A">همراهی در گذار</text>
    </g>

    <!-- ===== CTA SECTION ===== -->
    <rect x="0" y="780" width="1200" height="80" fill="url(#goldGradient)"/>
    <text x="600" y="816" font-family="Vazirmatn, Tahoma, sans-serif" font-size="20" font-weight="700" fill="#1B2845" text-anchor="middle" direction="rtl">آماده‌اید مسیر شناخت خود را آغاز کنید؟</text>
    <text x="600" y="838" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" fill="#131C30" text-anchor="middle" direction="rtl">یک تماس ۱۵ دقیقه‌ای رایگان برای شروع.</text>

    <!-- ===== FOOTER ===== -->
    <rect x="0" y="860" width="1200" height="40" fill="#1B2845"/>
    <text x="600" y="884" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" fill="#C9A87C" text-anchor="middle" direction="rtl">© مریم قابل | روان‌شناس بالینی — maryamghabel.ir</text>
</svg>
